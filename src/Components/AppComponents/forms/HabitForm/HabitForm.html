<form class="habit-form flex flex-col gap-4" data-role="form">
  <div>
    <label class="lc-label" for="habit-form-name">Hábito</label>
    <input class="lc-input" id="habit-form-name" type="text" maxlength="60" required />
  </div>
  <div>
    <label class="lc-label" for="habit-form-notes">Para qué (opcional)</label>
    <input class="lc-input" id="habit-form-notes" type="text" maxlength="120" />
  </div>
  <div>
    <label class="lc-label" for="habit-form-frequency">Frecuencia</label>
    <select class="lc-input" id="habit-form-frequency" data-role="frequency">
      <option value="daily">Todos los días</option>
      <option value="weekdays">Lunes a viernes</option>
      <option value="custom">Días concretos</option>
      <option value="weekly">Meta semanal (X veces)</option>
    </select>
  </div>
  <div data-role="weekdays-wrap" hidden>
    <span class="lc-label">Días</span>
    <div class="habit-form__days" data-role="weekdays"></div>
  </div>
  <div data-role="target-wrap" hidden>
    <label class="lc-label" for="habit-form-target">Veces por semana</label>
    <input class="lc-input" id="habit-form-target" type="number" min="1" max="7" value="4" />
  </div>
  <div>
    <label class="lc-label" for="habit-form-remind">Aviso en el teléfono (opcional)</label>
    <input class="lc-input" id="habit-form-remind" type="time" />
  </div>
  <div>
    <span class="lc-label">Color</span>
    <div class="habit-form__colors" data-role="colors"></div>
  </div>
  <p class="block-form__error" data-role="error" hidden></p>
  <div class="flex gap-2.5 [&_slice-button]:flex-1" data-role="actions"></div>
</form>
