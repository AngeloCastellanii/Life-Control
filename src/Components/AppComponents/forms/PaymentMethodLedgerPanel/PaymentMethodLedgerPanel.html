<div class="payment-method-ledger">
  <header class="payment-method-ledger__head">
    <div>
      <h2 class="payment-method-ledger__title" data-role="title">Movimientos</h2>
      <p class="payment-method-ledger__subtitle" data-role="subtitle"></p>
    </div>
    <span class="payment-method-ledger__balance" data-role="balance"></span>
    <div class="payment-method-ledger__method-actions" data-role="method-actions" hidden>
      <button type="button" class="lc-icon-btn" data-role="edit-method" aria-label="Editar método">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M4 20h4l10.5-10.5-4-4L4 16v4z" stroke-linejoin="round" />
          <path d="M13.5 6.5l4 4" stroke-linecap="round" />
        </svg>
      </button>
      <button type="button" class="lc-icon-btn lc-icon-btn--danger" data-role="delete-method" aria-label="Eliminar método">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M4 7h16M9 7V5h6v2M8 7l1 13h6l1-13" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <div class="payment-method-ledger__stats">
    <button
      type="button"
      class="payment-method-ledger__stat payment-method-ledger__stat--in"
      data-role="filter-in"
      aria-pressed="false"
      title="Clic: solo entradas · Doble clic: ver ambos"
    >
      <span class="payment-method-ledger__stat-label">Entradas</span>
      <span class="payment-method-ledger__stat-value" data-role="total-in">$0.00</span>
    </button>
    <button
      type="button"
      class="payment-method-ledger__stat payment-method-ledger__stat--out"
      data-role="filter-out"
      aria-pressed="false"
      title="Clic: solo salidas · Doble clic: ver ambos"
    >
      <span class="payment-method-ledger__stat-label">Salidas</span>
      <span class="payment-method-ledger__stat-value" data-role="total-out">$0.00</span>
    </button>
  </div>

  <ul class="payment-method-ledger__list" data-role="list"></ul>
  <p class="lc-empty payment-method-ledger__empty" data-role="empty" hidden>
    Sin movimientos en este método todavía.
  </p>
</div>
