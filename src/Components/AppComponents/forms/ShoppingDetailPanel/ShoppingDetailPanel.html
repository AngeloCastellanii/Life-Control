<div class="shopping-detail">
  <header class="shopping-detail__head">
    <h2 class="shopping-detail__name" data-role="name"></h2>
    <span class="shopping-detail__status" data-role="status"></span>
  </header>
  <dl class="shopping-detail__grid">
    <div class="shopping-detail__cell">
      <dt>Lista</dt>
      <dd data-role="frequency"></dd>
    </div>
    <div class="shopping-detail__cell">
      <dt>Precio</dt>
      <dd data-role="price"></dd>
    </div>
    <div class="shopping-detail__cell">
      <dt>Última vez</dt>
      <dd data-role="last"></dd>
    </div>
    <div class="shopping-detail__cell">
      <dt>Próxima</dt>
      <dd data-role="next"></dd>
    </div>
  </dl>
  <footer class="shopping-detail__actions">
    <button type="button" class="lc-btn-outline shopping-detail__pause" data-role="pause">Poner en reposo</button>
    <div class="shopping-detail__icons">
      <button type="button" class="lc-icon-btn" data-role="edit" aria-label="Editar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M4 20h4l10.5-10.5-4-4L4 16v4z" stroke-linejoin="round" />
          <path d="M13.5 6.5l4 4" stroke-linecap="round" />
        </svg>
      </button>
      <button type="button" class="lc-icon-btn lc-icon-btn--danger" data-role="delete" aria-label="Eliminar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M4 7h16M9 7V5h6v2M8 7l1 13h6l1-13" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </footer>
</div>
