<div class="lc-focus-root" data-role="root">
  <button type="button" class="lc-focus-toggle" data-role="toggle" aria-pressed="false" aria-expanded="false" aria-controls="lc-focus-panel" aria-label="Activar modo enfoque">
    Enfoque
  </button>
</div>
<div class="lc-focus-stage" id="lc-focus-panel" data-role="panel" hidden>
  <header class="lc-focus-stage__bar">
    <time class="lc-focus-stage__clock" data-role="clock">—</time>
    <button type="button" class="lc-focus-stage__close" data-role="close">Salir</button>
  </header>
  <div class="lc-focus-stage__hero">
    <p class="lc-focus-stage__remain" data-role="remain">—</p>
    <p class="lc-focus-stage__caption" data-role="caption"></p>
    <h2 class="lc-focus-stage__title" data-role="block-label">Ahora</h2>
    <p class="lc-focus-stage__range" data-role="block-range"></p>
  </div>
  <p class="lc-focus-stage__progress" data-role="progress" hidden></p>
  <ul class="lc-focus-stage__tasks" data-role="tasks"></ul>
  <p class="lc-focus-stage__empty" data-role="empty" hidden>Nada pendiente.</p>
</div>
