<section class="planner-section">
  <header class="lc-view-hero">
    <span class="lc-view-hero__icon lc-view-hero__icon--planner" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <rect x="4" y="5" width="16" height="15" rx="2" />
        <path d="M8 3v4M16 3v4M4 10h16" stroke-linecap="round" />
      </svg>
    </span>
    <div class="lc-view-hero__text">
      <h1 class="lc-section-title lc-view-hero__title">Planificador</h1>
      <p class="lc-view-hero__subtitle">El día, en bloques. Semana y mes sirven para saltar.</p>
    </div>
  </header>

  <div class="lc-card planner-section__toolbar">
    <div class="planner-section__nav">
      <button type="button" class="lc-icon-btn" data-role="prev" aria-label="Anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <span class="planner-section__period" data-role="period-label"></span>
      <button type="button" class="lc-icon-btn" data-role="next" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button type="button" class="planner-section__today" data-role="today">Hoy</button>
    </div>
    <div class="planner-section__controls">
      <button type="button" class="lc-btn-outline" data-role="add-block">Bloques</button>
      <div class="lc-segment" data-role="view-toggle">
        <button type="button" class="lc-segment__btn" data-view="day">Día</button>
        <button type="button" class="lc-segment__btn" data-view="week">Semana</button>
        <button type="button" class="lc-segment__btn" data-view="month">Mes</button>
      </div>
    </div>
  </div>

  <div data-role="view-day">
    <div class="planner-section__money" data-role="money-line" hidden>
      <button type="button" class="planner-section__money-chip" data-role="money-pay" hidden>0 pagos</button>
      <button type="button" class="planner-section__money-chip" data-role="money-receive" hidden>0 cobros</button>
      <button type="button" class="planner-section__money-chip" data-role="money-shopping" hidden>0 compras</button>
    </div>

    <button type="button" class="planner-section__inbox-strip" data-role="inbox-toggle" hidden aria-expanded="false">
      <span data-role="inbox-label">Sin bloque</span>
    </button>
    <div class="planner-section__inbox" data-role="inbox-panel" hidden>
      <div class="flex flex-col gap-2.5" data-role="tasks"></div>
      <p class="lc-empty" data-role="empty" hidden></p>
    </div>

    <div class="flex flex-col gap-3" data-role="blocks"></div>
    <p class="lc-empty" data-role="blocks-empty" hidden>Sin bloques. Configura uno arriba.</p>
  </div>

  <div data-role="view-week" hidden>
    <div class="planner-week" data-role="week-grid"></div>
  </div>

  <div data-role="view-month" hidden>
    <div class="planner-month">
      <div class="planner-month__weekdays">
        <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
      </div>
      <div class="planner-month__grid" data-role="month-grid"></div>
    </div>
  </div>
</section>
