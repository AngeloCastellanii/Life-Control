<section class="finances-section">
  <header class="lc-view-hero">
    <span class="lc-view-hero__icon lc-view-hero__icon--finances" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <rect x="3" y="6" width="18" height="13" rx="2" />
        <path d="M3 10h18" stroke-linecap="round" />
        <path d="M7 15h4" stroke-linecap="round" />
      </svg>
    </span>
    <div class="lc-view-hero__text">
      <h1 class="lc-section-title lc-view-hero__title">Finanzas</h1>
      <p class="lc-view-hero__subtitle">El total, tus métodos y los movimientos.</p>
    </div>
  </header>

  <div class="lc-card finances-section__hero">
    <p class="finances-section__total-label">Fondo total</p>
    <button type="button" class="finances-section__total-value" data-role="wallet-balance">$0.00</button>
    <div class="finances-section__hero-actions">
      <button type="button" class="lc-btn-outline" data-role="open-all-ledger">Movimientos</button>
      <button type="button" class="lc-btn-outline" data-role="add-method">Método</button>
    </div>
    <ul class="finances-section__methods" data-role="accounts-list"></ul>
    <p class="finances-section__accounts-empty lc-empty" data-role="accounts-empty" hidden>
      Añade un método con el nombre y saldo que quieras.
    </p>
  </div>

  <div class="lc-card finances-section__movements">
    <div class="lc-segment finances-section__filter" data-role="movement-filter">
      <button type="button" class="lc-segment__btn lc-segment__btn--active" data-filter="pay">Por pagar</button>
      <button type="button" class="lc-segment__btn" data-filter="receive">Por cobrar</button>
      <button type="button" class="lc-segment__btn" data-filter="done">Hechos</button>
    </div>
    <p class="finances-section__filter-total" data-role="filter-total">$0.00</p>
    <ul class="finances-section__list" data-role="movement-list"></ul>
    <p class="finances-section__empty lc-empty" data-role="movement-empty" hidden>Sin pendientes por pagar.</p>
  </div>
</section>
