<section class="habits-section">
  <header class="lc-view-hero">
    <span class="lc-view-hero__icon lc-view-hero__icon--habits" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.6-7 10-7 10z" stroke-linejoin="round" />
      </svg>
    </span>
    <div class="lc-view-hero__text">
      <h1 class="lc-section-title lc-view-hero__title">Hábitos</h1>
      <p class="lc-view-hero__subtitle">Marca lo de hoy. La racha se cuenta sola. Pulsa + para crear uno.</p>
    </div>
  </header>

  <div class="habits-section__toolbar">
    <div class="habits-section__filters" role="tablist" aria-label="Filtro de hábitos">
      <button type="button" class="habits-section__filter" data-habit-filter="today">Hoy</button>
      <button type="button" class="habits-section__filter" data-habit-filter="all">Todos</button>
      <button type="button" class="habits-section__filter" data-habit-filter="paused">Pausados</button>
      <button type="button" class="habits-section__filter habits-section__filter--focus" data-role="focus">Enfoque</button>
    </div>
    <p class="habits-section__progress" data-role="progress" hidden></p>
  </div>

  <div class="habits-section__summary lc-card" data-role="summary" hidden></div>
  <ul class="habits-section__list" data-role="list"></ul>
  <p class="lc-empty" data-role="empty" hidden>Sin hábitos. Pulsa +.</p>
</section>
