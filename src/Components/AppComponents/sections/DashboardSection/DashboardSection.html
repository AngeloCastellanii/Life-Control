<section class="dashboard-section">
  <header class="lc-view-hero">
    <span class="lc-view-hero__icon lc-view-hero__icon--dashboard" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
      </svg>
    </span>
    <div class="lc-view-hero__text">
      <h1 class="lc-section-title lc-view-hero__title" data-role="greeting-title">Bienvenido</h1>
      <p class="lc-view-hero__subtitle" data-role="date-subtitle">Hoy.</p>
    </div>
  </header>

  <div class="lc-view-stat-grid">
    <div class="lc-card dashboard-section__capacity lc-view-stat">
      <span class="lc-view-stat__label">Capacidad hoy</span>
      <div data-role="capacity-ring"></div>
      <p class="lc-view-stat__meta" data-role="capacity-text">0 / 0 hoy</p>
    </div>
    <div class="lc-card lc-view-stat">
      <span class="lc-view-stat__label">Tareas pendientes</span>
      <span class="lc-view-stat__value" data-role="tasks-count">0</span>
    </div>
    <div class="lc-card lc-view-stat">
      <span class="lc-view-stat__label">Bloques hoy</span>
      <span class="lc-view-stat__value" data-role="blocks-count">0</span>
    </div>
    <div class="lc-card lc-view-stat dashboard-section__rate-card" data-role="rate-card" role="button" tabindex="0" aria-label="Abrir calculadora de tipo de cambio">
      <span class="lc-view-stat__label">Tipo de cambio</span>
      <span class="lc-view-stat__value text-xl" data-role="rate">—</span>
      <button type="button" class="lc-btn-ghost text-left text-sm" data-role="rate-retry" hidden>Reintentar</button>
    </div>
  </div>

  <div class="lc-card dashboard-section__today">
    <div class="lc-view-card-head">
      <span class="lc-view-card-icon lc-view-card-icon--pay" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <div>
        <h2 class="lc-view-card-label">Vence hoy</h2>
      </div>
    </div>
    <ul class="dashboard-section__today-list" data-role="today-list"></ul>
    <p class="lc-empty" data-role="today-empty" hidden>Nada vence hoy.</p>
  </div>

  <div class="lc-card dashboard-section__tasks">
    <div class="lc-view-card-head">
      <span class="lc-view-card-icon lc-view-card-icon--pay" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M12 9v4M12 17h.01" stroke-linecap="round" />
          <path d="M10.3 4.3 3.6 17a2 2 0 0 0 1.7 3h13.4a2 2 0 0 0 1.7-3l-6.7-12.7a2 2 0 0 0-3.4 0z" stroke-linejoin="round" />
        </svg>
      </span>
      <div>
        <h2 class="lc-view-card-label">Tareas</h2>
      </div>
    </div>
    <div class="dashboard-section__filters" role="tablist" aria-label="Filtro de tareas">
      <button type="button" class="dashboard-section__filter" data-filter="all" role="tab">Todas</button>
      <button type="button" class="dashboard-section__filter" data-filter="urgent" role="tab">Urgentes</button>
      <button type="button" class="dashboard-section__filter" data-filter="blocks" role="tab">En bloques</button>
      <button type="button" class="dashboard-section__filter" data-filter="domain" role="tab">Por dominio</button>
    </div>
    <ul class="dashboard-section__urgent-list" data-role="task-list"></ul>
    <p class="lc-empty" data-role="task-empty" hidden>Sin pendientes.</p>
  </div>
</section>
